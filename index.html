<!DOCTYPE html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Matematički Ninja 2.0 - Zabavno učenje matematike za djecu"
    />
    <title>Matematički Ninja 2.0</title>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="assets/css/main.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/animations.css" />
    <link rel="stylesheet" href="assets/css/responsive.css" />

    <!-- New CSS additions for V2 -->
    <style>
        .home-screen { display: none; }
        .home-screen.active { display: block; }

        .op-select-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 20px 0;
        }

        .op-button {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 20px;
            font-size: 1.5em;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 120px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .op-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .op-button span.symbol {
            font-size: 2em;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .op-button span.label {
            font-size: 0.6em;
        }

        .strikes-container {
            font-size: 1.5em;
            margin: 10px 0;
            color: #ff5757;
        }

        .badges-screen { display: none; }
        .badges-screen.active { display: block; }

        .badges-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .badge-item {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0.5;
            filter: grayscale(1);
            transition: all 0.3s ease;
        }

        .badge-item.unlocked {
            opacity: 1;
            filter: grayscale(0);
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
            transform: scale(1.05);
        }

        .badge-icon {
            font-size: 2.5em;
            margin-bottom: 5px;
        }

        .badge-title {
            font-size: 0.8em;
            font-weight: bold;
            text-align: center;
        }

        /* Mini Break Overlay */
        .mini-break-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: white;
            text-align: center;
            display: none;
        }

        .mini-break-content {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: bounceIn 0.5s;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>

    <!-- Favicon -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥷</text></svg>"
    />
  </head>

  <body>
    <!-- In-Game Settings Toggle -->
    <div class="settings-toggle" id="settingsToggle">
      <button class="settings-toggle-btn" data-action="toggle-settings">⚙️</button>
    </div>

    <div class="game-container">
      <!-- HOME / OPERATION SELECT -->
      <div class="home-screen active">
        <h1>🥷 Matematički Ninja</h1>
        <div class="ninja-avatar"></div>

        <div class="op-select-grid">
           <button class="op-button" data-action="select-op" data-op="add">
               <span class="symbol">+</span>
               <span class="label">Zbrajanje</span>
           </button>
           <button class="op-button" data-action="select-op" data-op="sub">
               <span class="symbol">−</span>
               <span class="label">Oduzimanje</span>
           </button>
           <button class="op-button" data-action="select-op" data-op="mul">
               <span class="symbol">×</span>
               <span class="label">Množenje</span>
           </button>
           <button class="op-button" data-action="select-op" data-op="div">
               <span class="symbol">÷</span>
               <span class="label">Dijeljenje</span>
           </button>
        </div>

        <div class="menu-group user-actions">
          <button class="menu-button secondary" data-action="show-stats">
            Moje Statistike 📊
          </button>
          <button class="menu-button secondary" data-action="show-badges">
            Bedževi 🏅
          </button>
          <button class="menu-button secondary" data-action="show-settings">
            Postavke ⚙️
          </button>
        </div>
      </div>

      <!-- LEVEL SELECT -->
      <div class="level-select-screen" style="display: none">
        <h2 id="levelSelectTitle">Odaberi Razinu</h2>

        <div class="level-selector" id="levelSelector"></div>
        <button class="back-button" data-action="show-home">
          Natrag
        </button>
      </div>

      <!-- GAME SCREEN -->
      <div class="game-screen">
        <div class="game-header">
          <h2>Razina <span id="currentLevelDisplay">1</span></h2>
          <button class="exit-game-btn" data-action="exit-game">
            Izađi
          </button>
        </div>

        <div class="score-display">
          <div class="score-item">Bodovi: <span id="score">0</span></div>
          <div class="score-item">Niz: <span id="streak">0</span> 🔥</div>
        </div>

        <div class="strikes-container" id="strikesContainer">
            <!-- Hearts will be injected here -->
        </div>

        <!-- Timer if needed? V2 specs mention timer but maybe per question or total? Keeping old timer bar for now. -->
        <div class="timer-bar">
          <div class="timer-fill" id="timerFill"></div>
        </div>

        <div class="question-container">
          <span id="questionText"></span>
        </div>

        <div class="answer-buttons" id="answerButtons">
            <!-- Buttons injected by JS -->
        </div>
      </div>

      <!-- RESULTS SCREEN -->
      <div class="level-complete-screen">
        <div class="performance-image" id="resultEmoji">🤩</div>
        <div class="performance-title" id="resultTitle">IZVRSNO!</div>
        <div class="stars-container" id="resultStars"></div>

        <div class="results-container">
          <div class="result-item">
            <span class="result-label">Bodovi:</span>
            <span id="finalScore">0</span>
          </div>
          <div class="result-item">
            <span class="result-label">Točnost:</span>
            <span id="finalAccuracy">0%</span>
          </div>
          <div class="result-item">
             <span class="result-label">Greške:</span>
             <span id="finalMistakes">0</span>
          </div>
        </div>

        <div id="newBadgesContainer" style="margin: 10px 0; color: gold; font-weight: bold;"></div>

        <div class="level-complete-actions">
          <button class="menu-button primary" data-action="retry-level">
            Igraj Ponovno
          </button>
          <button class="menu-button secondary" data-action="show-level-select">
            Odaberi Razinu
          </button>
          <button class="menu-button" data-action="show-home">
            Glavni Izbornik
          </button>
        </div>
      </div>

      <!-- STATS SCREEN -->
      <div class="stats-screen">
        <h2>📊 Moje Statistike</h2>
        <div id="statsContent">
            <!-- Dynamic stats content -->
        </div>
        <button class="back-button" data-action="show-home">Natrag</button>
      </div>

      <!-- BADGES SCREEN -->
      <div class="badges-screen">
         <h2>🏅 Moji Bedževi</h2>
         <div class="badges-grid" id="badgesGrid">
             <!-- Badges injected here -->
         </div>
         <button class="back-button" data-action="show-home">Natrag</button>
      </div>

      <!-- SETTINGS SCREEN -->
      <div class="settings-screen">
         <h2>⚙️ Postavke</h2>
         <!-- Reuse existing settings markup structure but ensure IDs match app logic -->
         <div class="settings-content">
             <!-- Audio controls (simplified for MVP V2 integration) -->
             <div class="audio-control-group">
                <button class="audio-button" id="toggleMute">🔊 Zvuk</button>
             </div>
         </div>
         <button class="back-button" data-action="show-home">Natrag</button>
      </div>

    </div>

    <!-- Mini Break Overlay -->
    <div class="mini-break-overlay" id="miniBreakOverlay">
        <div class="mini-break-content">
            <h2>😅 Ups! Malo odmora...</h2>
            <p>Napravio si 3 greške. Uzmi dah!</p>
            <div style="font-size: 3em; margin: 20px;">🧘</div>
            <button class="menu-button primary" data-action="resume-after-break">Nastavi</button>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
